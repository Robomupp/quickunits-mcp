name: publish

# Publicering utan npm-token: GitHub bevisar sin identitet mot npm med OIDC,
# och npm kontrollerar att repository + workflow-fil stämmer med den
# "Trusted Publisher" som är registrerad på paketet. Inga hemligheter lagras.
#
# npm håller på att stänga av tokens som kringgår 2FA (2026-10-27), så den här
# vägen är den som håller: inget lösenord, ingen token som kan gå ut.
#
# Krav på npmjs.com (engångsinställning av kontoinnehavaren):
#   npmjs.com → paketet quickunits → Settings → Trusted Publishing
#   → Repository: Robomupp/quickunits-mcp
#   → Workflow filename: publish.yml
#   → Environment: (lämnas tomt)

on:
  release:
    types: [published]   # publiceras när en GitHub-release skapas
  workflow_dispatch:       # och manuellt från Actions-fliken
    inputs:
      rensa_disttag:
        description: 'Ta bort kvarlämnad dist-tagg token-verify (publicerar inget)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write          # krävs för OIDC — detta är behörigheten npm läser

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # OIDC-stöd i npm kräver npm >= 11.5.1; Actions-bildens npm är äldre.
      - name: Uppgradera npm
        run: npm install -g npm@latest && npm --version

      - name: Installation
        run: npm ci || npm install

      - name: Tester
        run: npm test

      # Städning: en äldre token-verifiering lämnade dist-taggen token-verify
      # efter sig. Token som kringgår 2FA får inte radera dist-taggar (403),
      # men en OIDC-anslutning med dist-tag-behörighet gör det. Körs därför
      # alltid innan publicering — den är ofarlig när taggen redan är borta.
      - name: Ta bort kvarlämnad dist-tagg
        continue-on-error: true
        run: npm dist-tag ls quickunits; npm dist-tag rm quickunits token-verify || true

      # Ingen NODE_AUTH_TOKEN: autentiseringen sker via id-token (OIDC).
      # --provenance lägger ett signerat ursprungsbevis i paketet.
      - name: Publicera
        if: inputs.rensa_disttag != true
        run: npm publish --provenance --access public
